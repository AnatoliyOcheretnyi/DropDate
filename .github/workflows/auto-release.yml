name: Auto Release on Merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      front_bump: ${{ steps.release.outputs.front_bump }}
      backend_bump: ${{ steps.release.outputs.backend_bump }}
      mobile_bump: ${{ steps.release.outputs.mobile_bump }}
      requested: ${{ steps.release.outputs.requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Parse release markers
        id: release
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          front="$(echo "$message" | grep -Eo '#release:front:(major|minor|patch)' | tail -n1 | cut -d: -f3 || true)"
          back="$(echo "$message" | grep -Eo '#release:backend:(major|minor|patch)' | tail -n1 | cut -d: -f3 || true)"
          mobile="$(echo "$message" | grep -Eo '#release:mobile:(major|minor|patch)' | tail -n1 | cut -d: -f3 || true)"
          requested=false
          if [ -n "$front$back$mobile" ]; then requested=true; fi
          echo "front_bump=$front" >> "$GITHUB_OUTPUT"
          echo "backend_bump=$back" >> "$GITHUB_OUTPUT"
          echo "mobile_bump=$mobile" >> "$GITHUB_OUTPUT"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            apps/frontend/yarn.lock
      - name: Set up Go
        if: needs.plan.outputs.backend_bump != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile
      - name: Install frontend dependencies
        if: needs.plan.outputs.front_bump != ''
        working-directory: apps/frontend
        run: yarn install --frozen-lockfile
      - name: Check frontend
        if: needs.plan.outputs.front_bump != ''
        run: yarn nx run-many -t lint,typecheck,test,build -p frontend --nxBail --skipNxCache
      - name: Install Playwright browser
        if: needs.plan.outputs.front_bump != ''
        working-directory: apps/frontend
        run: yarn playwright install --with-deps chromium
      - name: Run frontend smoke tests
        if: needs.plan.outputs.front_bump != ''
        run: yarn nx run frontend:e2e --nxBail --skipNxCache
      - name: Check backend
        if: needs.plan.outputs.backend_bump != ''
        run: yarn nx run-many -t lint,test,build -p backend --nxBail --skipNxCache
      - name: Backend race detector
        if: needs.plan.outputs.backend_bump != ''
        run: yarn nx run backend:race --skipNxCache
      - name: Check mobile
        if: needs.plan.outputs.mobile_bump != ''
        run: yarn nx run mobile:lint --skipNxCache

  deploy:
    needs: [plan, checks]
    if: needs.plan.outputs.requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vercel CLI
        if: needs.plan.outputs.front_bump != ''
        run: npm install --global vercel
      - name: Deploy frontend
        if: needs.plan.outputs.front_bump != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel deployment secrets."
            exit 1
          fi
          vercel deploy --prod --token "$VERCEL_TOKEN"
      - name: Deploy backend
        if: needs.plan.outputs.backend_bump != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          curl --fail-with-body --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Deploy mobile
        if: needs.plan.outputs.mobile_bump != ''
        env:
          MOBILE_DEPLOY_HOOK_URL: ${{ secrets.MOBILE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$MOBILE_DEPLOY_HOOK_URL" ]; then
            echo "Missing MOBILE_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          curl --fail-with-body --show-error --silent -X POST "$MOBILE_DEPLOY_HOOK_URL"

  release:
    needs: [plan, checks, deploy]
    if: needs.plan.outputs.requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump versions after successful deployment
        id: versions
        shell: bash
        run: |
          chmod +x scripts/bump-version.sh
          if [ -n "${{ needs.plan.outputs.front_bump }}" ]; then
            next="$(scripts/bump-version.sh frontend '${{ needs.plan.outputs.front_bump }}')"
            git add apps/frontend/VERSION
            echo "frontend=$next" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ needs.plan.outputs.backend_bump }}" ]; then
            next="$(scripts/bump-version.sh backend '${{ needs.plan.outputs.backend_bump }}')"
            git add apps/backend/VERSION
            echo "backend=$next" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ needs.plan.outputs.mobile_bump }}" ]; then
            next="$(scripts/bump-version.sh mobile '${{ needs.plan.outputs.mobile_bump }}')"
            git add apps/mobile/VERSION
            echo "mobile=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bump verified app versions [skip ci]"
          git push origin HEAD:main
      - name: Create and push verified tags
        run: |
          [ -z "${{ steps.versions.outputs.frontend }}" ] || git tag "frontend/v${{ steps.versions.outputs.frontend }}"
          [ -z "${{ steps.versions.outputs.backend }}" ] || git tag "backend/v${{ steps.versions.outputs.backend }}"
          [ -z "${{ steps.versions.outputs.mobile }}" ] || git tag "mobile/v${{ steps.versions.outputs.mobile }}"
          git push origin --tags
      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.versions.outputs.frontend }}" ]; then
            tag="frontend/v${{ steps.versions.outputs.frontend }}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Frontend v${{ steps.versions.outputs.frontend }}" --notes "Verified frontend deployment."
          fi
          if [ -n "${{ steps.versions.outputs.backend }}" ]; then
            tag="backend/v${{ steps.versions.outputs.backend }}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Backend v${{ steps.versions.outputs.backend }}" --notes "Verified backend deployment."
          fi
          if [ -n "${{ steps.versions.outputs.mobile }}" ]; then
            tag="mobile/v${{ steps.versions.outputs.mobile }}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Mobile v${{ steps.versions.outputs.mobile }}" --notes "Verified mobile deployment."
          fi
