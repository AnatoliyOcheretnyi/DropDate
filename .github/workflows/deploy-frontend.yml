name: Deploy Frontend

on:
  push:
    tags:
      - "frontend/v*"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            apps/frontend/yarn.lock

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: yarn install --frozen-lockfile

      - name: Lint, typecheck and test
        run: yarn nx run-many -t lint,typecheck,test -p frontend --nxBail

      - name: Build
        run: yarn nx run frontend:build

      - name: Install Playwright browser
        working-directory: apps/frontend
        run: yarn playwright install --with-deps chromium

      - name: Run smoke tests
        run: yarn nx run frontend:e2e --nxBail

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel secrets (VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID)."
            exit 1
          fi
          vercel deploy --prod --token "$VERCEL_TOKEN"

  release:
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ github.ref_name }}
