name: Deploy Mobile

on:
  push:
    tags:
      - "mobile/v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MOBILE_DEPLOY_HOOK_URL: ${{ secrets.MOBILE_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger mobile deploy hook
        run: |
          if [ -z "$MOBILE_DEPLOY_HOOK_URL" ]; then
            echo "Missing MOBILE_DEPLOY_HOOK_URL secret. Skipping deploy."
            exit 0
          fi
          curl -X POST "$MOBILE_DEPLOY_HOOK_URL"
