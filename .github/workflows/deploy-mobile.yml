name: Deploy Mobile

on:
  push:
    tags:
      - "mobile/v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mobile deploy hook
        if: ${{ secrets.MOBILE_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "$MOBILE_DEPLOY_HOOK_URL"
        env:
          MOBILE_DEPLOY_HOOK_URL: ${{ secrets.MOBILE_DEPLOY_HOOK_URL }}

      - name: Missing mobile deploy hook
        if: ${{ secrets.MOBILE_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Missing MOBILE_DEPLOY_HOOK_URL secret. Skipping deploy."
