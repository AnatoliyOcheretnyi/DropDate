name: Create GitHub Release

on:
  push:
    tags:
      - "frontend/v*"
      - "backend/v*"
      - "mobile/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build release metadata
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%/*}"
          version="${tag#*/}"
          case "$app" in
            frontend) label="Frontend" ;;
            backend) label="Backend" ;;
            mobile) label="Mobile" ;;
            *) label="Release" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${label} ${version}" >> "$GITHUB_OUTPUT"
          echo "body=Release for ${label} ${version}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          release_name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
