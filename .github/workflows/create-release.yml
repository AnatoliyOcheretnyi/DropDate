name: Create GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          app="${TAG%%/*}"
          version="${TAG#*/}"
          case "$app" in
            frontend) label="Frontend" ;;
            backend) label="Backend" ;;
            mobile) label="Mobile" ;;
            *) label="Release" ;;
          esac
          gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPOSITORY" --title "$label $version" --notes "Release for $label $version"
