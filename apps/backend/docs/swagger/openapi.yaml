openapi: 3.0.3
info:
  title: DropDate API
  version: "0.1.0"
  description: |-
    Проста API, щоб перевірити статус сервера та дізнатись дату наступного релізу фільму/серіалу.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      description: Повертає простий статус, що сервер живий.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /next-release:
    get:
      summary: Наступна дата релізу
      description: >
        Повертає інформацію про найближчий реліз. Спочатку звертаємось до TVMaze
        (серіали), далі — до TMDB (серіали + фільми).
      parameters:
        - in: query
          name: title
          schema:
            type: string
          required: false
          description: Назва фільму або серіалу (нечутлива до регістру).
        - in: query
          name: tmdbId
          schema:
            type: integer
          required: false
          description: Опціонально — конкретний TMDB ID для точного пошуку.
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv]
          required: false
          description: Тип тайтлу в TMDB (movie або tv).
      responses:
        '200':
          description: Вдало знайшли реліз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseInfo'
        '400':
          description: Не передали title
        '404':
          description: Не знайшли реліз
  /suggest:
    get:
      summary: Підказки для пошуку
      description: Повертає короткий список варіантів із TMDB для автодоповнення.
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: Рядок пошуку (мінімум 2 символи).
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
          required: false
          description: Скільки результатів повернути (1-10).
      responses:
        '200':
          description: Короткі підказки з TMDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '400':
          description: Некоректний рядок пошуку
components:
  schemas:
    ReleaseInfo:
      type: object
      properties:
        title:
          type: string
          example: "Dune: Part Two"
        type:
          type: string
          enum: [movie, series]
        nextRelease:
          type: string
          format: date-time
          example: 2024-03-01T00:00:00Z
        source:
          type: string
          example: tmdb-mock
        posterUrl:
          type: string
          format: uri
          example: "https://image.tmdb.org/t/p/w342/abc123.jpg"
        status:
          type: string
          enum: [upcoming, released, ended]
          example: upcoming
    Suggestion:
      type: object
      properties:
        id:
          type: integer
          example: 31917
        title:
          type: string
          example: "Dune: Part Two"
        mediaType:
          type: string
          enum: [movie, tv]
        year:
          type: string
          example: "2024"
