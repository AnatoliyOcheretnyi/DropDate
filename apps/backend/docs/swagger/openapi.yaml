openapi: 3.0.3
info:
  title: DropDate API
  version: "0.1.0"
  description: |-
    Проста API, щоб перевірити статус сервера та дізнатись дату наступного релізу фільму/серіалу.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      description: Повертає простий статус, що сервер живий.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /next-release:
    get:
      summary: Наступна дата релізу
      description: >
        Повертає інформацію про найближчий реліз (серіали або фільми) з TMDB.
        Результати кешуються приблизно на 30 хвилин, тому повторні запити швидші.
      parameters:
        - in: query
          name: title
          schema:
            type: string
          required: true
          description: Назва фільму або серіалу (нечутлива до регістру). Обовʼязкова навіть якщо передаєте `tmdbId`.
        - in: query
          name: tmdbId
          schema:
            type: integer
          required: false
          description: Опціонально — конкретний TMDB ID для точного пошуку.
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv]
          required: false
          description: Тип тайтлу в TMDB (movie або tv).
      responses:
        '200':
          description: Вдало знайшли реліз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseInfo'
        '400':
          description: Не передали title
        '404':
          description: Не знайшли реліз
  /suggest:
    get:
      summary: Підказки для пошуку
      description: Повертає короткий список варіантів із TMDB для автодоповнення.
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: Рядок пошуку (мінімум 2 символи).
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
          required: false
          description: Скільки результатів повернути (1-10).
      responses:
        '200':
          description: Короткі підказки з TMDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '400':
          description: Некоректний рядок пошуку
  /trending:
    get:
      summary: Популярне зараз
      description: Повертає популярні фільми і серіали з TMDB.
      parameters:
        - in: query
          name: window
          schema:
            type: string
            enum: [day, week]
            default: day
          required: false
          description: Вікно трендів (day або week).
        - in: query
          name: limit
          schema:
            type: integer
            default: 18
          required: false
          description: Скільки результатів повернути для кожного типу.
      responses:
        '200':
          description: Списки популярних фільмів і серіалів
          content:
            application/json:
              schema:
                type: object
                properties:
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '500':
          description: Помилка TMDB
  /search:
    get:
      summary: Повний пошук
      description: Повертає список тайтлів за запитом з пагінацією.
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: Пошуковий запит.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          required: false
          description: Номер сторінки.
      responses:
        '200':
          description: Результати пошуку
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  totalResults:
                    type: integer
        '400':
          description: Некоректний запит
        '500':
          description: Помилка TMDB
  /details:
    get:
      summary: Деталі тайтлу
      description: Повертає деталі тайтлу, реліз та рекомендації.
      parameters:
        - in: query
          name: tmdbId
          schema:
            type: integer
          required: true
          description: TMDB ID.
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv]
          required: true
          description: Тип тайтлу.
      responses:
        '200':
          description: Детальна інформація
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      mediaType:
                        type: string
                      overview:
                        type: string
                      tagline:
                        type: string
                      posterUrl:
                        type: string
                      backdropUrl:
                        type: string
                      status:
                        type: string
                      releaseDate:
                        type: string
                      firstAirDate:
                        type: string
                      lastAirDate:
                        type: string
                      nextAirDate:
                        type: string
                      nextEpisodeName:
                        type: string
                      lastEpisodeName:
                        type: string
                      seasonCount:
                        type: integer
                      episodeCount:
                        type: integer
                      runtime:
                        type: integer
                      genres:
                        type: array
                        items:
                          type: string
                      networks:
                        type: array
                        items:
                          type: string
                      voteAverage:
                        type: number
                      voteCount:
                        type: integer
                      popularity:
                        type: number
                      homepage:
                        type: string
                      originCountry:
                        type: array
                        items:
                          type: string
                  release:
                    $ref: '#/components/schemas/ReleaseInfo'
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '400':
          description: Некоректний запит
        '404':
          description: Не знайдено
        '500':
          description: Помилка TMDB
  /bulk-next-release:
    post:
      summary: Пакетне оновлення релізів
      description: >
        Повертає масив результатів для списку тайтлів або TMDB ID.
        Кожен елемент відповідає одному вхідному `clientId` і містить `info` або `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [clientId]
                    properties:
                      clientId:
                        type: string
                        example: "saved:the-boys"
                      title:
                        type: string
                        example: "The Boys"
                      tmdbId:
                        type: integer
                        example: 76479
                      mediaType:
                        type: string
                        enum: [movie, tv]
              required: [items]
      responses:
        '200':
          description: Пакетна відповідь
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        clientId:
                          type: string
                        info:
                          $ref: '#/components/schemas/ReleaseInfo'
                        error:
                          type: string
        '400':
          description: Некоректний payload
  /saved:
    get:
      summary: Список збережених тайтлів користувача
      parameters:
        - in: query
          name: listType
          schema:
            type: string
            enum: [follow, watchlist, favorite, watched, disliked]
          required: false
          description: Фільтр за типом списку (опційно)
      responses:
        '200':
          description: Список збережених тайтлів
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedItem'
        '401':
          description: Неавторизований
        '500':
          description: Помилка бекенду
    post:
      summary: Додати тайтл у список
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: Збережений тайтл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedItem'
        '400':
          description: Некоректні дані
        '401':
          description: Неавторизований
        '500':
          description: Помилка бекенду
  /saved/items:
    delete:
      summary: Видалити тайтл зі списку
      parameters:
        - in: query
          name: tmdbId
          schema:
            type: integer
          required: true
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv]
          required: true
        - in: query
          name: listType
          schema:
            type: string
            enum: [follow, watchlist, favorite, watched, disliked]
          required: false
      responses:
        '204':
          description: Видалено
        '400':
          description: Некоректні дані
        '401':
          description: Неавторизований
        '500':
          description: Помилка бекенду
    patch:
      summary: Оновити статистику тайтла у списку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedStatsRequest'
      responses:
        '204':
          description: Оновлено
        '400':
          description: Некоректні дані
        '401':
          description: Неавторизований
        '500':
          description: Помилка бекенду
components:
  schemas:
    SavedItem:
      type: object
      properties:
        tmdbId:
          type: integer
          example: 76479
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
          example: "The Boys"
        nextRelease:
          type: string
          format: date-time
          example: 2026-04-08T12:00:00Z
        status:
          type: string
          enum: [upcoming, released, ended]
        posterUrl:
          type: string
          format: uri
        backdropUrl:
          type: string
          format: uri
        listTypes:
          type: array
          items:
            type: string
            enum: [follow, watchlist, favorite, watched, disliked]
        userRating:
          type: integer
          example: 8
        watchCount:
          type: integer
          example: 2
        lastWatchedAt:
          type: string
          format: date-time
        source:
          type: string
          example: tmdb
        type:
          type: string
          enum: [movie, series]
    SaveRequest:
      type: object
      required: [tmdbId, mediaType, title]
      properties:
        tmdbId:
          type: integer
          example: 76479
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
          example: "The Boys"
        nextRelease:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, released, ended]
        posterUrl:
          type: string
          format: uri
        backdropUrl:
          type: string
          format: uri
        listType:
          type: string
          enum: [follow, watchlist, favorite, watched, disliked]
          example: follow
        userRating:
          type: integer
        watchCount:
          type: integer
        lastWatchedAt:
          type: string
          format: date-time
    SavedStatsRequest:
      type: object
      required: [tmdbId, mediaType, listType]
      properties:
        tmdbId:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        listType:
          type: string
          enum: [follow, watchlist, favorite, watched, disliked]
        userRating:
          type: integer
        watchCount:
          type: integer
        lastWatchedAt:
          type: string
          format: date-time
    ReleaseInfo:
      type: object
      properties:
        title:
          type: string
          example: "Dune: Part Two"
        type:
          type: string
          enum: [movie, series]
        nextRelease:
          type: string
          format: date-time
          example: 2024-03-01T00:00:00Z
        source:
          type: string
          example: tmdb-mock
        posterUrl:
          type: string
          format: uri
          example: "https://image.tmdb.org/t/p/w342/abc123.jpg"
        backdropUrl:
          type: string
          format: uri
          example: "https://image.tmdb.org/t/p/w780/def456.jpg"
        status:
          type: string
          enum: [upcoming, released, ended]
          example: upcoming
    Suggestion:
      type: object
      properties:
        id:
          type: integer
          example: 31917
        title:
          type: string
          example: "Dune: Part Two"
        mediaType:
          type: string
          enum: [movie, tv]
        year:
          type: string
          example: "2024"
        posterUrl:
          type: string
          format: uri
          example: "https://image.tmdb.org/t/p/w342/abc123.jpg"
